name: expense_tracker
description: Offline Expense Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  intl: ^0.20.1
  csv: ^8.0.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  file_picker: ^12.0.0-beta.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true